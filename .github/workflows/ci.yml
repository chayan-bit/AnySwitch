# CI runs what needs no game data and no real GPU.
# The Metal and iOS suites (dm/gfx/tests, dm/gfx/tex/tests, dm/ios/tests) stay local-only, see CONTRIBUTING.md.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Byte-compile every Python file
        run: python -m compileall -q dm scripts
      - name: ShellCheck (errors only)
        run: shellcheck -S error dm/ios/tools/build_ipa.sh scripts/setup-labels.sh

  python-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install lz4 capstone
      - name: Game profiles parse
        run: python3 -I dm/games/game.py list
      - name: Unit tests
        env:
          # Any profile works: these tests read its tracked tables only, never game files.
          DM_GAME: '0100F43008C44000'
        run: |
          python3 -I dm/games/tests/test_gpu_timestamps_default.py
          python3 -I dm/games/tests/test_settings_defaults.py
          python3 -I dm/games/tests/test_auto_defaults.py
          python3 -I dm/tools/tests/test_exefs_patches.py
          python3 -I scripts/tests/test_checkpoint.py
          python3 -I scripts/tests/test_compat_run.py
          python3 -I dm/gfx/tests/test_psoexpand.py
          python3 -I dm/gfx/tests/test_shader_split_zlib.py
          python3 -I dm/gfx/tests/test_tbdr_budget.py
          python3 -I dm/gfx/tests/test_pairs.py
          python3 -I dm/gfx/tests/test_flexarch.py
          python3 -I dm/ios/tests/test_device_gpu.py

  host-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The host unit tests need a game profile only, no game files.
      - run: make -C dm/host/tests GAME=0100F43008C44000 run
      # The in-app settings registry and the haptics mapping: Foundation and plain C, no device
      - run: make -C dm/ios/tests run
